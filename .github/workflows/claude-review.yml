name: Claude review

# Reviews each pull request when it opens and after each push, and answers
# replies in its own review threads. When no issues are open, it adds the
# ready-to-merge label and asks the repository owner for a review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'pull_request_review_comment' &&
         github.event.comment.in_reply_to_id &&
         github.event.comment.user.type != 'Bot' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Claude keeps the token for its own calls; the commands it runs do not get it.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request' && 'push' || github.event.comment.id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You review a pull request in a Mintlify help docs repository. Customers read these pages. The author writes docs, not code. Write every comment in plain, friendly English and say exactly what to change.

            REPO: ${{ github.repository }}
            OWNER: ${{ github.repository_owner }}
            NAME: ${{ github.event.repository.name }}
            PR: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event_name }} (${{ github.event.action }})
            NEW COMMITS: ${{ github.event.before }}...${{ github.event.after }}
            REPLY: comment ${{ github.event.comment.id }}, in the thread that starts with comment ${{ github.event.comment.in_reply_to_id }}

            The pull request is checked out in the working directory. Your comments from earlier runs come from github-actions[bot].

            ## 1. Read the pull request

            - `gh pr view PR --json title,body,author,files` and `gh pr diff PR`.
            - The review threads:
              `gh api graphql -f query='query { repository(owner: "OWNER", name: "NAME") { pullRequest(number: PR) { reviewThreads(first: 100) { nodes { id isResolved path line comments(first: 50) { nodes { databaseId author { login } body } } } } } } }'`
            - Your summary from the last run: the comment by github-actions[bot] that starts with `<!-- claude-review -->` in `gh api repos/REPO/issues/PR/comments`.
            - README.md and docs.json, for the conventions of this repository.

            ## 2a. If EVENT is pull_request_review_comment

            Somebody replied in a review thread. If github-actions[bot] did not start that thread, go to step 3. Else read the whole thread and answer in it:
            `gh api repos/REPO/pulls/PR/comments/<first comment of the thread>/replies -f body='...'`

            - The author wants other wording: answer with a new ```suggestion block that uses their wording, so they can commit it.
            - The author wants to keep the text as it is: accept it, say so in one sentence, and resolve the thread (the mutation is in 2b).
            - The author asks a question: answer it.

            Do not look for new issues in this run. Keep the summary-only issues from your last summary.

            ## 2b. If EVENT is pull_request

            - Check each unresolved thread that github-actions[bot] started. If the new commits fix the issue, or the author replied that they want to keep the text, resolve the thread:
              `gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "THREAD_ID"}) { thread { isResolved } } }'`
            - Check again each summary-only issue from your last summary.
            - Review the changes. If NEW COMMITS has two commit ids, review only what changed between them (`gh api repos/REPO/compare/BEFORE...AFTER`), not the whole pull request again. Else review the whole pull request.
            - Post each new issue as an inline comment on its line with `mcp__github_inline_comment__create_inline_comment` (confirmed: true). When you can give the correct text, add a ```suggestion block, so the author can commit it with one click. Do not repeat a point that a thread makes already.
            - If an issue has no changed line to attach to (for example, a new page that is not in docs.json), put it in the summary only.

            Flag only problems that hurt a reader or break the site:

            - A step is missing, wrong, or in the wrong order, or a reader cannot follow it.
            - Text that says something different from other pages in this repository.
            - Spelling and grammar mistakes. Product, platform and feature names that are spelled differently from the other pages.
            - MDX that does not build: tags that are not closed, components that do not exist, bad frontmatter. Every page needs a title and a description.
            - Links and images that point to pages or files that do not exist.
            - A new page that is not in the docs.json navigation. A page that moved or was deleted without a redirect.
            - Long dashes (— or –) in new text. Use a comma, a period or " - ".

            Do not flag wording that is clear already, or matters of taste.

            ## 3. Return

            - open_issues: the number of issues that are open at the end of this run. Count the unresolved threads that github-actions[bot] started, plus the summary-only issues.
            - summary: Markdown for one pull request comment. When open_issues is 0, write "No open issues. Ready to merge." Else give each open issue in one line, with a link to its thread when it has one.

            Do not post the summary yourself. The workflow posts it.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
            --json-schema '{"type":"object","properties":{"open_issues":{"type":"integer"},"summary":{"type":"string"}},"required":["open_issues","summary"]}'

      - name: Post summary and tell the owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -eu
          open=$(jq -r '.open_issues' <<<"$OUTPUT")
          body=$(printf '<!-- claude-review -->\n%s\n' "$(jq -r '.summary' <<<"$OUTPUT")")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          if [ "$open" = "0" ]; then
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=ready-to-merge" > /dev/null
            if [ "$AUTHOR" != "$OWNER" ]; then
              gh api "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$OWNER" > /dev/null
            fi
          else
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/ready-to-merge" > /dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$OWNER" > /dev/null 2>&1 || true
          fi
